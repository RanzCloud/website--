services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ranzpanel
      POSTGRES_USER: ranzpanel
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ranzpanel:change-me@db:5432/ranzpanel?schema=public
      JWT_SECRET: change-this
      ADMIN_EMAIL: admin@ranzpanel.com
      ADMIN_PASSWORD: change-this
      FRONTEND_URL: https://ranzpanel.up.railway.app
      APP_ENCRYPTION_KEY: change-this-encryption-secret
    depends_on: [db]
    ports: ["3000:3000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: https://ranzpanel.up.railway.app/api
    depends_on: [backend]
    ports: ["3001:3001"]
volumes:
  pgdata:
